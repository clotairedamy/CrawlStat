[package]
name = "crawlstat-engine"
description = "CrawlStat crawl engine: fetch, parse, store and audit a website locally."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "crawlstat_engine"
path = "src/lib.rs"

[[bin]]
name = "crawlstat-cli"
path = "src/bin/cli.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
blake3 = "1.8.7"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5.61", features = ["derive"] }
csv = "1.4.0"
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc", "rand_core", "signature"] }
flate2 = "1.1.10"
futures = "0.3.34"
humantime = "2.4.0"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
percent-encoding = "2.3.2"
quick-xml = "0.41.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "gzip", "brotli", "deflate", "charset", "json", "stream", "system-proxy", "cookies", "blocking"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
texting_robots = "0.2.2"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
webpki-roots = "1.0.11"

[dev-dependencies]
axum = "0.8.9"
libc = "0.2.191"
rand = "0.10.3"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["test-util", "macros", "rt-multi-thread", "time"] }
