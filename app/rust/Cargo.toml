[package]
name = "crawlstat_bridge"
description = "flutter_rust_bridge glue between the CrawlStat engine and the Flutter app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Deliberately identical to the package name: cargokit looks for an artifact
# called `lib<package name>.a`, while cargo names it after the lib target. A
# hyphen in one and an underscore in the other makes the macOS build fail with
# "Unable to find bundle for dynamic library", which is a memorable afternoon.
name = "crawlstat_bridge"
# `staticlib` is what cargokit links into the macOS and iOS app bundles with
# `-force_load`; `cdylib` is what its CMake builds load on Linux and Windows;
# `lib` lets this crate's own tests use it directly.
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
crawlstat-engine = { path = "../../engine" }
flutter_rust_bridge = "=2.13.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.40.2"
anyhow = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
# `flutter_rust_bridge`'s `#[frb]` macro expands to code guarded by this cfg,
# which is set by the code generator and not by cargo. Declaring it keeps
# `-D warnings` usable in CI without silencing real cfg mistakes.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
